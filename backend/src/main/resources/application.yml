spring:
  application:
    name: hotel-booking-portal

  # Optional .env file (KEY=VALUE lines). Works when started from the repo root or from /backend.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    # No defaults for credentials on purpose: nothing secret lives in the repository.
    url: ${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only verifies it matches the entities
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    format:
      date: iso                 # yyyy-MM-dd for LocalDate request params

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  pricing:
    weekend-surcharge-percent: 15   # applied to Friday and Saturday nights
    currency: INR

logging:
  level:
    com.thomascook.hotelbooking: INFO
