# Tests run on in-memory H2 (MySQL compatibility mode) with the real Flyway migrations, so no MySQL or Docker is needed.
spring:
  datasource:
    url: jdbc:h2:mem:hotel_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
