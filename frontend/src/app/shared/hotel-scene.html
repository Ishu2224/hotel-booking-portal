<svg
  viewBox="0 0 400 260"
  preserveAspectRatio="xMidYMid slice"
  role="img"
  [attr.aria-label]="'Illustration of ' + location()"
  [class.animated]="animated()"
>
  <defs>
    <linearGradient [attr.id]="'sky' + uid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" [attr.stop-color]="palette().sky[0]" />
      <stop offset=".55" [attr.stop-color]="palette().sky[1]" />
      <stop offset="1" [attr.stop-color]="palette().sky[2]" />
    </linearGradient>
    <linearGradient [attr.id]="'lake' + uid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a73" />
      <stop offset="1" stop-color="#8d4a86" />
    </linearGradient>
    <pattern [attr.id]="'win' + uid" width="12" height="14" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="7" fill="#c8f0f5" opacity=".6" />
    </pattern>
  </defs>

  <rect width="400" height="260" [attr.fill]="'url(#sky' + uid + ')'" />

  <g class="sun">
    <circle [attr.cx]="palette().sx" [attr.cy]="palette().sy" [attr.r]="palette().sr * 2.3" [attr.fill]="palette().sun" opacity=".2" />
    <circle [attr.cx]="palette().sx" [attr.cy]="palette().sy" [attr.r]="palette().sr * 1.5" [attr.fill]="palette().sun" opacity=".3" />
    <circle [attr.cx]="palette().sx" [attr.cy]="palette().sy" [attr.r]="palette().sr" [attr.fill]="palette().sun" />
  </g>

  <g class="clouds" fill="#fff" opacity=".4">
    <ellipse cx="70" cy="44" rx="28" ry="8" />
    <ellipse cx="94" cy="38" rx="18" ry="7" />
    <ellipse cx="236" cy="30" rx="32" ry="8" />
    <ellipse cx="262" cy="25" rx="18" ry="6" />
  </g>

    @case ('mumbai') {
